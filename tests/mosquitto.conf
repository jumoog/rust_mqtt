# Broker configuration for the rsmqtt integration tests:
#   docker run -d --name rsmqtt-mosq -p 18830:1883 -p 18831:9001 \
#     -v <repo>/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf eclipse-mosquitto:2
listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
persistence false

# Stress tests: the default (1000) drops QoS 1/2 messages queued for a
# subscriber that is briefly slower than the publisher.
max_queued_messages 2000000
max_inflight_messages 0
log_dest stdout
