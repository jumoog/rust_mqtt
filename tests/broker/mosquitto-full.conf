# Broker for tests/winccoa/option_tests.ctl; start with tests/broker/start-broker.ps1
#
#   host port  listener
#   18840      MQTT, anonymous
#   18841      WebSocket, anonymous
#   18842      MQTT over TLS
#   18843      WebSocket over TLS
#   18844      MQTT over TLS, client certificate required
#   18845      MQTT, user name + password (testuser / "test pass")

per_listener_settings true
persistence false
max_queued_messages 100000
log_dest stdout

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

listener 8883
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
allow_anonymous true

listener 8884
protocol websockets
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
allow_anonymous true

listener 8885
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
allow_anonymous true

listener 1885
allow_anonymous false
password_file /mosquitto/passwd
