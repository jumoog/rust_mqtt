[package]
name = "rsmqtt"
description = "C ABI MQTT client (v3.1, v3.1.1, v5) built on the pure-Rust Eclipse Paho client, for WinCC OA managers and drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rsmqtt"
# staticlib: linked into the WinCC OA driver executable.
# cdylib:    rsmqtt.dll for hosts that prefer dynamic loading.
# rlib:      Rust integration tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The pure-Rust Paho client (2.0, branch v2) is not on crates.io yet: pinned to
# a commit of the Eclipse repository. To work on a local checkout instead, see
# "Building" in the README (a [patch] in .cargo/config.toml).
paho-mqtt = { git = "https://github.com/eclipse-paho/paho.mqtt.rust", rev = "be3570486daab3d9ed7f65479b975c8eaeb2995d", default-features = false, features = ["tokio", "tls", "websocket"] }
futures = "0.3"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3"
