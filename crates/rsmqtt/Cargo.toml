[package]
name = "rsmqtt"
description = "C ABI MQTT client (v3.1, v3.1.1, v5) built on the pure-Rust Eclipse Paho client, for WinCC OA managers and drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rsmqtt"
# staticlib: linked into the WinCC OA driver executable.
# cdylib:    rsmqtt.dll for hosts that prefer dynamic loading.
# rlib:      Rust integration tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
paho-mqtt = { path = "../../../paho.mqtt.rust", default-features = false, features = ["tokio", "tls", "websocket"] }
futures = "0.3"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3"
