[package]
name = "rsmqtt-wincc"
description = "WinCC OA driver logic of rsmqtt: address syntax, JSON paths, Sparkplug B host application, redundancy names, message routing, MSA service state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rsmqtt_wincc"
# staticlib: the one Rust library the WinCC OA driver links; it contains the
#            rsmqtt C ABI as well (two Rust staticlibs would clash in one exe).
# rlib:      Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
rsmqtt = { path = "../rsmqtt" }
# UTF-8 validation of the non-ASCII parts of JSON strings (SIMD)
simdutf8 = "0.1"
# Sparkplug B protobuf types (sparkplug_b.proto, generated with prost); no MQTT
# client or async runtime (the srad host framework itself is not used)
srad-types = "0.4"
# only for the json_bench example (feature bench-sonic)
sonic-rs = { version = "0.5.12", optional = true }

[features]
# json_bench compares the JSON extractor with sonic-rs
bench-sonic = ["dep:sonic-rs"]

[[example]]
name = "json_bench"
required-features = ["bench-sonic"]
