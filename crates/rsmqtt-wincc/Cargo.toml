[package]
name = "rsmqtt-wincc"
description = "WinCC OA driver logic of rsmqtt: address syntax, JSON paths, Sparkplug B host application, redundancy names"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rsmqtt_wincc"
# staticlib: the one Rust library the WinCC OA driver links; it contains the
#            rsmqtt C ABI as well (two Rust staticlibs would clash in one exe).
# rlib:      Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
rsmqtt = { path = "../rsmqtt" }
# Sparkplug B protobuf types (sparkplug_b.proto, generated with prost); no MQTT
# client or async runtime (the srad host framework itself is not used)
srad-types = "0.4"
